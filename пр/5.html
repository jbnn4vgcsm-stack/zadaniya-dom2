<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
       function isEvenOrOdd(number) {
        return number % 2 === 0 ? "Четное" : "Нечетное";
    }

    // Тест и вывод
    const num1 = 7;
    const num2 = 4;
    
    console.log("Задание 5 (7):", isEvenOrOdd(num1));
    console.log("Задание 5 (4):", isEvenOrOdd(num2));
    alert("Задание 5:\nЧисло 7: " + isEvenOrOdd(num1) + "\nЧисло 4: " + isEvenOrOdd(num2));  
    </script>
</body>
</html>
